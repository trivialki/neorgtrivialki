<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Химия с Хафизовым. Тривиальные названия неорганических веществ</title>
<style>
:root{--bg:#EDF2EE;--ink:#14302A;--mut:#5B7168;--pan:#fff;--ln:#CFDBD3;--ok:#2E7D4F;--bad:#B8402F;--sul:#E8B400;
--o:#3E6FB0;--h:#2E8B6A;--a:#A8650A;--s:#8A5AA8;--x:#B5483A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B1A;--ink:#E6F0EA;--mut:#93ABA0;--pan:#17282A;--ln:#2A4040;--ok:#5CC389;--bad:#F08B79;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1B1A;--ink:#E6F0EA;--mut:#93ABA0;--pan:#17282A;--ln:#2A4040;--ok:#5CC389;--bad:#F08B79;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sul);outline-offset:2px}
.chip{flex:none;border:1.5px solid var(--ln);background:var(--pan);border-radius:20px;padding:6px 14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes{display:flex;margin:10px 0 16px;border-bottom:2px solid var(--ln)}
.modes button{flex:1;background:none;border:0;padding:10px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.modes button[aria-selected=true]{color:var(--ink);border-color:var(--sul)}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--sul);transition:width .4s}
.scene{perspective:900px;height:260px;margin-bottom:14px}
.card{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;cursor:pointer;animation:in .35s ease-out}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.front{background:var(--c);color:#fff}.front b{font-size:28px;line-height:1.2;font-weight:800}.front small{position:absolute;top:14px;opacity:.85;font-size:13px}.front em{position:absolute;bottom:14px;font-size:13px;opacity:.8;font-style:normal}
.back{background:var(--pan);border:2px solid var(--c);transform:rotateY(180deg)}
.fm{font-size:38px;font-weight:800;color:var(--ink)}.sys{color:var(--mut);margin-top:8px}
sub{font-size:.6em}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
.btns{display:flex;gap:10px}.btns button{flex:1;padding:13px;border-radius:12px;border:2px solid var(--ink);background:var(--pan);font-weight:600}
.btns .go{background:var(--ink);color:var(--bg)}
.q{background:var(--pan);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px;border-left:6px solid var(--c)}
.q small{color:var(--mut)}.q b{display:block;font-size:24px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px 16px;border-radius:12px;border:2px solid var(--ln);background:var(--pan);font-size:18px;font-weight:600}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--pan))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--pan));animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:10px}
.fb{min-height:26px;margin:4px 0 10px;color:var(--mut)}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0 10px 12px;border-bottom:1px solid var(--ln);border-left:5px solid var(--c)}
.li b{font-weight:600}.li span{font-weight:800}.li small{grid-column:1/-1;color:var(--mut)}
.done{text-align:center;padding:40px 0}.done b{font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.tools button{border:1.5px solid var(--ln);background:var(--pan);border-radius:20px;padding:6px 14px;font-size:14px}.tools button[aria-pressed=true]{background:var(--sul);color:#14302A;border-color:var(--sul)}
.nav{display:flex;align-items:center;justify-content:center;gap:22px}.nav button{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--pan);font-size:22px}.nav span{font-weight:600;min-width:70px;text-align:center}
.star{position:absolute;top:8px;right:10px;background:none;border:0;font-size:26px;color:#fff;z-index:2}.back .star{color:var(--sul)}
.res{text-align:center;background:var(--pan);border-radius:18px;padding:22px 16px;margin-bottom:16px;border-top:6px solid var(--sul)}.res>b{display:block;font-size:44px;font-weight:800}.res>div{color:var(--mut);font-size:18px}.res p{margin:10px 0 14px;font-weight:600}.res small{color:var(--mut)}
.score{display:flex;gap:10px}.score div{flex:1;border-radius:12px;padding:10px;font-size:14px}.score b{display:block;font-size:28px}.s1{background:color-mix(in srgb,var(--ok) 18%,var(--pan));color:var(--ok)}.s2{background:color-mix(in srgb,var(--bad) 18%,var(--pan));color:var(--bad)}
.resl{margin-top:10px;width:100%}.rs{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 4px;border-top:1px solid var(--ln)}.rs b{font-size:19px}.rs span{color:var(--mut);text-align:right}.dsc{font-size:14px;color:var(--mut);margin-top:6px}
sup{font-size:.6em}input.sr{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--pan);color:var(--ink);font:inherit;margin:10px 0 4px}
.gh{margin:16px 0 2px;font-weight:800;font-size:15px}
</style></head><body><main>
<h1>Химия с Хафизовым</h1>
<p class="sub">Тривиальные названия неорганических веществ для ЕГЭ: учи карточками, проверяй тестом</p>
<div class="row" id="cats" role="group" aria-label="Класс веществ"></div>
<div class="modes" role="tablist" id="modes"></div>
<div id="app"></div>
</main>
<script>
const CATS={all:['Все','#14302A'],o:['Оксиды','#3E6FB0'],h:['Основания','#2E8B6A'],a:['Кислоты','#A8650A'],s:['Соли','#8A5AA8'],x:['Бинарные','#B5483A'],k:['Кристаллогидраты','#2A7F9A']};
const RAW=`o|Негашёная известь|CaO|оксид кальция
o|Жжёная магнезия|MgO|оксид магния
o|Железная окалина|Fe3O4|оксид железа(II, III)
o|Красный железняк|Fe2O3|оксид железа(III)
o|Корунд|Al2O3|оксид алюминия
o|Пиролюзит|MnO2|оксид марганца(IV)
o|Вода, лёд|H2O|оксид водорода
o|Угарный газ|CO|оксид углерода(II)
o|Углекислый газ, сухой лёд|CO2|оксид углерода(IV)
o|Закись азота, веселящий газ|N2O|оксид азота(I)
o|Бурый газ, лисий хвост|NO2|оксид азота(IV)
o|Сернистый газ, сернистый ангидрид|SO2|оксид серы(IV)
o|Серный газ, серный ангидрид|SO3|оксид серы(VI)
o|Кварц, кремнезём, песок|SiO2|оксид кремния
h|Нашатырный спирт|NH3·H2O|гидроксид аммония (NH4OH), водный раствор аммиака
h|Едкий натр, каустик, каустическая сода|NaOH|гидроксид натрия
h|Едкое кали|KOH|гидроксид калия
h|Гашёная известь, известковое молоко|Ca(OH)2|гидроксид кальция
a|Соляная кислота|HCl|хлороводородная кислота
a|Плавиковая кислота|HF|фтороводородная кислота
a|Синильная кислота, цианистоводородная|HCN|циановодородная кислота
a|Царская водка|HNO3 + HCl (1:3)|смесь концентрированных растворов HNO3 и HCl в объёмном соотношении 1:3
s|Поваренная соль, пищевая соль, галит|NaCl|хлорид натрия
s|Мел, мрамор, известняк|CaCO3|карбонат кальция
s|Пищевая (питьевая) сода|NaHCO3|гидрокарбонат натрия
s|Кальцинированная сода|Na2CO3|карбонат натрия
s|Поташ|K2CO3|карбонат калия
s|Натриевая селитра|NaNO3|нитрат натрия
s|Калийная селитра|KNO3|нитрат калия
s|Аммиачная селитра|NH4NO3|нитрат аммония
s|Нашатырь|NH4Cl|хлорид аммония
s|Марганцовка|KMnO4|перманганат калия
s|Хромпик|K2Cr2O7|дихромат калия
s|Флюорит|CaF2|фторид кальция
s|Бертолетова соль|KClO3|хлорат калия
s|Малахит|(CuOH)2CO3|дигидроксокарбонат меди
s|Криолит|Na3AlF6|гексафтороалюминат натрия
s|Красная кровяная соль|K3[Fe(CN)6]|гексацианоферрат(III) калия
s|Жёлтая кровяная соль|K4[Fe(CN)6]|гексацианоферрат(II) калия
x|Киноварь|HgS|сульфид ртути
x|Пирит|FeS2|дисульфид железа
x|Карборунд|SiC|карбид кремния
x|Аммиачная вода|NH3 (р-р)|насыщенный водный раствор аммиака (NH3)
x|Баритовая вода|Ba(OH)2 (р-р)|насыщенный водный раствор Ba(OH)2
x|Бромная вода|Br2 (р-р)|водный раствор Br2
x|Известковая вода|Ca(OH)2 (р-р)|насыщенный водный раствор Ca(OH)2
k|Медный купорос|CuSO4·5H2O|пентагидрат сульфата меди
k|Железный купорос|FeSO4·7H2O|гептагидрат сульфата железа
k|Цинковый купорос|ZnSO4·7H2O|гептагидрат сульфата цинка
k|Гипс|CaSO4·2H2O|дигидрат сульфата кальция
k|Глауберова соль|Na2SO4·10H2O|декагидрат сульфата натрия
k|Кристаллическая сода|Na2CO3·10H2O|декагидрат карбоната натрия`;
const D=RAW.split('\n').map(l=>{const[c,n,f,s]=l.split('|');return{c,n,f,s}});
const fm=f=>f.replace(/(?<=[A-Za-z\)\]])(\d+)/g,'<sub>$1</sub>');
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='ege-trivial-v1';
let S={stars:[],best:{},miss:{},cat:'all',mode:'cards',side:'n'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cat=CATS[S.cat]?S.cat:'all',mode=['cards','quiz','list','acids'].includes(S.mode)?S.mode:'cards';
const pool=()=>cat=='all'?D:D.filter(x=>x.c==cat);
const col=c=>CATS[c][1];
const $=id=>document.getElementById(id);
function chrome(){
 $('cats').style.display=mode=='acids'?'none':'';
 $('cats').innerHTML=Object.keys(CATS).map(k=>`<button class="chip" aria-pressed="${k==cat}" data-k="${k}">${CATS[k][0]}</button>`).join('');
 $('modes').innerHTML=[['cards','Карточки'],['quiz','Тест'],['list','Список'],['acids','Кислоты']].map(([k,t])=>`<button role="tab" aria-selected="${k==mode}" data-m="${k}">${t}</button>`).join('');
}
$('cats').onclick=e=>{const k=e.target.dataset.k;if(k){cat=k;go()}};
$('modes').onclick=e=>{const k=e.target.dataset.m;if(k){mode=k;go()}};
function go(){S.cat=cat;S.mode=mode;S.side=side;save();chrome();({cards:cards,quiz:quiz,list:list,acids:acids})[mode]()}

/* Карточки в стиле Quizlet */
let dk=[],ix=0,side=S.side||'n',stars=new Set(S.stars),onlyStar=false;
function cards(){dk=pool();ix=0;drawC()}
function drawC(){
 const A=$('app'),d=onlyStar?dk.filter(x=>stars.has(x.n)):dk;
 const tools=`<div class="tools"><button id="shf">Перемешать</button><button id="swp">${side=='n'?'Сначала название':'Сначала формула'}</button><button id="onl" aria-pressed="${onlyStar}">Только ★</button></div>`;
 if(!d.length){A.innerHTML=`<p class="sub" style="text-align:center;padding:40px 0">Нет карточек со звёздочкой. Отметь ★ на нужных карточках.</p>`+tools;bind();return}
 ix=(ix+d.length)%d.length;const it=d[ix],on=stars.has(it.n),st=`<button class="star" aria-label="Отметить звёздочкой">${on?'★':'☆'}</button>`;
 const A1=side=='n'?it.n:fm(it.f),B1=side=='n'?fm(it.f):it.n;
 A.innerHTML=`<div class="bar"><i style="width:${(ix+1)/d.length*100}%"></i></div>
 <div class="scene"><div class="card" id="cd" tabindex="0" role="button" aria-label="Перевернуть карточку" style="--c:${col(it.c)}">
 <div class="face front">${st}<small>${CATS[it.c][0]}</small><b>${A1}</b></div>
 <div class="face back">${st}<div class="fm" style="${side=='n'?'':'font-size:28px'}">${B1}</div><div class="sys">${side=='n'?fm(it.s):fm(it.f)+', '+fm(it.s)}</div></div></div></div>
 <div class="nav"><button id="pv" aria-label="Назад">←</button><span>${ix+1} / ${d.length}</span><button id="nt" aria-label="Вперёд">→</button></div>`+tools;
 const cd=$('cd');cd.onclick=e=>{if(e.target.closest('.star'))return;cd.classList.toggle('flip')};
 cd.onkeydown=e=>{if(e.key==' '||e.key=='Enter'){e.preventDefault();cd.classList.toggle('flip')}};
 cd.querySelectorAll('.star').forEach(b=>b.onclick=()=>{on?stars.delete(it.n):stars.add(it.n);S.stars=[...stars];save();drawC()});
 $('pv').onclick=()=>{ix--;drawC()};$('nt').onclick=()=>{ix++;drawC()};bind();
}
function bind(){
 $('shf').onclick=()=>{dk=sh(dk);ix=0;drawC()};
 $('swp').onclick=()=>{side=side=='n'?'f':'n';S.side=side;save();drawC()};
 $('onl').onclick=()=>{onlyStar=!onlyStar;ix=0;drawC()};
}
document.addEventListener('keydown',e=>{if(mode!='cards'||!$('pv'))return;if(e.key=='ArrowRight')$('nt').click();if(e.key=='ArrowLeft')$('pv').click()});

/* Тест */
let T=null;
function quiz(){
 const p=pool(),n=p.length,b=S.best[cat],ms=p.filter(x=>S.miss[x.n]);
 const lens=[10,20].filter(x=>x<n).concat([n]);
 $('app').innerHTML=`<div class="q" style="--c:${col(cat)}"><small>Тест по группе</small><b>${CATS[cat][0]}</b></div>
 ${b?`<p class="sub" style="text-align:center">Лучший результат: ${b.sc} из ${b.n} (${b.pct}%)</p>`:''}
 <p class="sub" style="text-align:center">Сколько вопросов?</p>
 <div class="btns" id="ln">${lens.map(x=>`<button class="go" data-n="${x}">${x==n?'Все '+n:x}</button>`).join('')}</div>
 ${ms.length?`<div class="btns" style="margin-top:10px"><button id="ms">Работа над ошибками (${ms.length})</button></div>`:''}
 <div class="tools"><button id="rs">Сбросить прогресс</button></div>`;
 $('ln').onclick=e=>{const k=+e.target.dataset.n;if(k)startT(sh(p).slice(0,k),false)};
 if(ms.length)$('ms').onclick=()=>startT(sh(ms),true);
 $('rs').onclick=e=>{if(e.target.dataset.sure){S.stars=[];S.best={};S.miss={};save();stars=new Set();onlyStar=false;quiz()}else{e.target.dataset.sure=1;e.target.textContent='Нажми ещё раз, чтобы удалить всё'}};
}
function startT(items,mist){T={items,i:0,sc:0,bad:[],mist};nextQ()}
function nextQ(){
 if(T.i>=T.items.length)return result();
 const it=T.items[T.i],len=T.items.length;
 const dup=D.filter(x=>x.f==it.f).length>1;
 const rev=!dup&&Math.random()<.4; // формула -> название
 const key=rev?'n':'f';
 let alt=D.filter(x=>x.c==it.c&&x.f!=it.f);
 if(alt.length<3)alt=alt.concat(D.filter(x=>x.c!=it.c&&x.f!=it.f));
 const seen=new Set([it[key]]),opts=[it];
 for(const x of sh(alt)){if(opts.length==4)break;if(!seen.has(x[key])){seen.add(x[key]);opts.push(x)}}
 const o=sh(opts);
 $('app').innerHTML=`<div class="stat"><span>Вопрос ${T.i+1} из ${len}</span><span>Верно: ${T.sc}</span></div>
 <div class="bar"><i style="width:${T.i/len*100}%"></i></div>
 <div class="q" style="--c:${col(it.c)}"><small>${rev?'Как называется вещество?':'Формула вещества'}</small><b>${rev?fm(it.f):it.n}</b></div>
 <div id="os">${o.map((x,i)=>`<button class="opt" data-i="${i}">${rev?x.n:fm(x.f)}</button>`).join('')}</div>
 <div class="fb" id="fb" aria-live="polite"></div><div class="btns" id="nx"></div>`;
 $('os').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||$('nx').innerHTML)return;
  const x=o[b.dataset.i],right=x==it;
  if(right){T.sc++;delete S.miss[it.n]}else{T.bad.push(it);S.miss[it.n]=1}
  save();
  [...document.querySelectorAll('.opt')].forEach((el,i)=>{if(o[i]==it)el.classList.add('ok');else if(el==b)el.classList.add('bad')});
  $('fb').innerHTML=(right?'Верно! ':'Неверно. ')+`${it.n}: ${fm(it.f)}, ${fm(it.s)}`;
  $('nx').innerHTML=`<button class="go" id="nb">${T.i+1==len?'Показать результат':'Дальше'}</button>`;
  $('nb').onclick=()=>{T.i++;nextQ()};$('nb').focus();
 };
}
function result(){
 const n=T.items.length,bad=T.bad.length,pct=Math.round(T.sc/n*100);
 const old=S.best[cat];let note='';
 if(!T.mist){if(!old||pct>old.pct){S.best[cat]={sc:T.sc,n,pct};note=old?'Новый рекорд!':''}save()}
 const v=pct>=90?'Отлично!':pct>=70?'Хорошо, осталось подтянуть мелочи':pct>=50?'Неплохо, но стоит повторить':'Вернись к карточкам и попробуй ещё раз';
 $('app').innerHTML=`<div class="res"><small>${CATS[cat][0]}${T.mist?', работа над ошибками':''}</small><b>${T.sc} из ${n}</b><div>${pct}%</div><p>${v} ${note}</p>
 <div class="score"><div class="s1"><b>${T.sc}</b>верно</div><div class="s2"><b>${bad}</b>неверно</div></div></div>
 ${bad?`<p class="sub">Разбор ошибок</p>`+T.bad.map(x=>`<div class="li" style="--c:${col(x.c)}"><b>${x.n}</b><span>${fm(x.f)}</span><small>${fm(x.s)}</small></div>`).join(''):''}
 <div class="btns" style="margin-top:16px">${bad?'<button id="rm">Повторить ошибки</button>':''}<button class="go" id="ra">Пройти заново</button></div>
 <div class="tools"><button id="tc">К карточкам</button></div>`;
 if(bad)$('rm').onclick=()=>startT(sh(T.bad),true);
 $('ra').onclick=quiz;$('tc').onclick=()=>{mode='cards';go()};
}

/* Список */
function list(){
 $('app').innerHTML=pool().map(x=>`<div class="li" style="--c:${col(x.c)}"><b>${x.n}</b><span>${fm(x.f)}</span><small>${fm(x.s)}</small></div>`).join('');
}
/* Вкладка «Кислоты» */

c|Na3[Cr(OH)6]|гексагидроксохромат(III) натрия
s|NaAlO2|алюминат натрия (метаалюминат)
s|Na2ZnO2|цинкат натрия
s|K2ZnO2|цинкат калия`.split('\n').forEach(l=>{if(l[0]=='#')g=l.slice(1);else{const[t,f,n]=l.split('|');SA.push({t,f,n,g})}})}
const sup=t=>fm(t).replace(/\^([^\s,;)<]+)/g,'<sup>$1</sup>');
const TN={all:'Все',s:'Средние',a:'Кислые',b:'Основные',d:'Двойные',m:'Смешанные',h:'Кристаллогидраты',c:'Комплексные'};
const TC={s:'#3E6FB0',a:'#A8650A',b:'#B5483A',d:'#8A5AA8',m:'#2E8B6A',h:'#2A7F9A',c:'#6B7280'};
let ak=null,aix=0,aside='n',sty='all',sq='';
function acids(){
 const sub=S.asub||'cards';
 $('app').innerHTML=`<div class="row" id="sb" style="margin-bottom:12px"><button class="chip" aria-pressed="${sub=='cards'}" data-s="cards">Карточки кислот (${AC.length})</button><button class="chip" aria-pressed="${sub=='salts'}" data-s="salts">Примеры солей (${SA.length})</button></div><div id="sv"></div>`;
 $('sb').onclick=e=>{const k=e.target.dataset.s;if(k){S.asub=k;save();acids()}};
 sub=='cards'?acDraw():saDraw();
}
function acDraw(){
 if(!ak)ak=[...AC];
 aix=(aix+ak.length)%ak.length;const it=ak[aix],n=aside=='n';
 const res=it.r.map(([f,nm])=>`<div class="rs"><b>${sup(f)}</b><span>${nm}</span></div>`).join('');
 $('sv').innerHTML=`<div class="bar"><i style="width:${(aix+1)/ak.length*100}%"></i></div>
 <div class="scene" style="height:340px"><div class="card" id="cd" tabindex="0" role="button" aria-label="Перевернуть карточку" style="--c:#A8650A">
 <div class="face front"><small>Кислоты для ЕГЭ</small><b style="font-size:${n?28:44}px">${n?it.n:sup(it.f)}</b><em>нажми, чтобы увидеть ответ</em></div>
 <div class="face back"><div class="fm" style="font-size:${n?36:24}px">${n?sup(it.f):it.n}</div><div class="dsc">${it.d}</div><div class="resl">${res}</div></div></div></div>
 <div class="nav"><button id="apv" aria-label="Назад">←</button><span>${aix+1} / ${ak.length}</span><button id="ant" aria-label="Вперёд">→</button></div>
 <div class="tools"><button id="ash">Перемешать</button><button id="asw">${n?'Сначала название':'Сначала формула'}</button></div>`;
 const cd=$('cd');cd.onclick=()=>cd.classList.toggle('flip');
 cd.onkeydown=e=>{if(e.key==' '||e.key=='Enter'){e.preventDefault();cd.classList.toggle('flip')}};
 $('apv').onclick=()=>{aix--;acDraw()};$('ant').onclick=()=>{aix++;acDraw()};
 $('ash').onclick=()=>{ak=sh(ak);aix=0;acDraw()};$('asw').onclick=()=>{aside=n?'f':'n';acDraw()};
}
document.addEventListener('keydown',e=>{if(mode!='acids'||!$('ant'))return;if(e.key=='ArrowRight')$('ant').click();if(e.key=='ArrowLeft')$('apv').click()});
function saDraw(){
 $('sv').innerHTML=`<div class="row">${Object.keys(TN).map(k=>`<button class="chip" aria-pressed="${k==sty}" data-t="${k}">${TN[k]}</button>`).join('')}</div>
 <input class="sr" id="sq" type="search" placeholder="Поиск: формула, название или кислота" value="${sq}"><p class="sub" id="cnt"></p><div id="sl"></div>`;
 document.querySelector('#sv .row').onclick=e=>{const k=e.target.dataset.t;if(k){sty=k;saDraw()}};
 $('sq').oninput=e=>{sq=e.target.value;saFill()};saFill();
}
function saFill(){
 const q=sq.trim().toLowerCase();let last='';
 const L=SA.filter(x=>(sty=='all'||x.t==sty)&&(!q||(x.n+' '+x.f+' '+x.g).toLowerCase().includes(q)));
 $('cnt').textContent=`Найдено: ${L.length} из ${SA.length}`;
 $('sl').innerHTML=L.map(x=>{let h='';if(x.g!=last){last=x.g;h=`<div class="gh">${x.g}</div>`}
  return h+`<div class="li" style="--c:${TC[x.t]}"><b>${x.n}</b><span>${fm(x.f)}</span><small>${TN[x.t]}</small></div>`}).join('')||'<p class="sub">Ничего не найдено</p>';
}

go();
</script></body></html>
