function pool(){return cat=='all'?D:D.filter(function(x){return x.c==cat||(cfg.al&&cfg.al[x.c]==cat)})}
function chrome(){
 $('cats').innerHTML=Object.keys(C).filter(function(k){return !(cfg.hide&&cfg.hide.indexOf(k)>-1)}).map(function(k){return '<button class="chip" aria-pressed="'+(k==cat)+'" data-k="'+k+'">'+C[k][0]+'</button>'}).join('');
 var M=[['cards','Карточки'],['quiz','Тест'],['list','Список']];
 if(cfg.resTab&&cat=='a')M.push(['res','Кислотные остатки']);
 if(cfg.back)M.push(['back',cfg.back]);
 $('modes').innerHTML=M.map(function(m){return '<button role="tab" aria-selected="'+(m[0]==mode)+'" data-m="'+m[0]+'">'+m[1]+'</button>'}).join('');
}
$('cats').onclick=function(e){var k=e.target.dataset.k;if(k){cat=k;go()}};
$('modes').onclick=function(e){
 var k=e.target.dataset.m;if(!k)return;
 if(k=='res'){S.mode='cards';save();mountDeck(R,CFG[cfg.resTab],tok);return}
 if(k=='back'){mountDeck(R,CFG[cfg.backTo],tok);return}
 mode=k;go();
};
function go(){S.cat=cat;S.mode=mode;save();chrome();({cards:cards,quiz:quiz,list:list})[mode]()}
var dk=[],ix=0,only=false;
function cards(){dk=pool();ix=0;dc()}
function dc(){
 var d=only?dk.filter(function(x){return S.stars.indexOf(x.id)>-1}):dk,A=$('app');
 var tools='<div class="tools"><button id="shf">Перемешать</button>'+(d.some(function(x){return isR(x.c)||isN(x.c)})?'<button id="swp">'+(S.side=='q'?'Сначала название':'Сначала формула')+'</button>':'')+'<button id="onl" aria-pressed="'+only+'">Только ★</button></div>';
 if(!d.length){A.innerHTML='<p class="sub" style="text-align:center;padding:40px 0">Нет карточек со звёздочкой. Отметь ★ на нужных карточках.</p>'+tools;bind();return}
 ix=(ix+d.length)%d.length;var it=d[ix],on=S.stars.indexOf(it.id)>-1,st='<button class="star" aria-label="Звёздочка">'+(on?'★':'☆')+'</button>';
 var f=S.side=='q'||!isR(it.c),F=f?it.q:it.a,B=f?it.a:it.q,X=it.x;
 if(S.side=='q'&&isN(it.c)){
  /* оксиды, гидроксиды, кислоты, соли: спереди название, сзади формула + тип */
  var h=hd(it);F=h;B=it.q;X=it.a+it.x.slice(h.length)}
 A.innerHTML='<div class="bar"><i style="width:'+(ix+1)/d.length*100+'%"></i></div><div class="scene"'+(cfg.draw?' style="height:340px"':'')+'><div class="card" id="cd" tabindex="0" role="button" aria-label="Перевернуть карточку" style="--c:'+col(it.c)+'"><div class="face front">'+st+'<small>'+C[it.c][0]+'</small>'+(cfg.draw=='front'&&it.m?'<div class="mol">'+drawMol(it.m)+'</div>':'<b style="font-size:'+(F.length>26?20:28)+'px">'+fm(F)+'</b>')+'<em>нажми, чтобы увидеть ответ</em></div><div class="face back">'+st+'<div class="fm" style="font-size:'+(B.length>22?22:34)+'px">'+fm(B)+'</div>'+(cfg.draw=='back'&&it.m?'<div class="mol">'+drawMol(it.m)+'</div>':'')+'<div class="sys">'+fm(X)+'</div></div></div></div><div class="nav"><button id="pv" aria-label="Назад">←</button><span>'+(ix+1)+' / '+d.length+'</span><button id="nt" aria-label="Вперёд">→</button></div>'+tools;
 var cd=$('cd');cd.onclick=function(e){if(e.target.closest('.star'))return;cd.classList.toggle('flip')};
 cd.onkeydown=function(e){if(e.key==' '||e.key=='Enter'){e.preventDefault();cd.classList.toggle('flip')}};
 cd.querySelectorAll('.star').forEach(function(b){b.onclick=function(){if(on)S.stars.splice(S.stars.indexOf(it.id),1);else S.stars.push(it.id);save();dc()}});
 $('pv').onclick=function(){ix--;dc()};$('nt').onclick=function(){ix++;dc()};bind();
}
function bind(){
 $('shf').onclick=function(){dk=sh(dk);ix=0;dc()};
 if($('swp'))$('swp').onclick=function(){S.side=S.side=='q'?'a':'q';save();dc()};
 $('onl').onclick=function(){only=!only;ix=0;dc()};
}
document.addEventListener('keydown',function(e){if(mytok!==DKTOK||mode!='cards'||!$('pv'))return;if(e.key=='ArrowRight')$('nt').click();if(e.key=='ArrowLeft')$('pv').click()});
var T=null;
function quiz(){
 var p=pool(),n=p.length,b=S.best[cat],ms=p.filter(function(x){return S.miss[x.id]});
 var lens=[10,20].filter(function(x){return x<n}).concat([n]);
 $('app').innerHTML='<div class="q" style="--c:'+col(cat)+'"><small>Тест по группе</small><b>'+C[cat][0]+'</b></div>'+(b?'<p class="sub" style="text-align:center">Лучший результат: '+b.sc+' из '+b.n+' ('+b.pct+'%)</p>':'')+'<p class="sub" style="text-align:center">Сколько вопросов?</p><div class="btns" id="ln">'+lens.map(function(x){return '<button class="go" data-n="'+x+'">'+(x==n?'Все '+n:x)+'</button>'}).join('')+'</div>'+(ms.length?'<div class="btns" style="margin-top:10px"><button id="ms">Работа над ошибками ('+ms.length+')</button></div>':'')+'<div class="tools"><button id="rs">Сбросить прогресс</button></div>';
 $('ln').onclick=function(e){var k=+e.target.dataset.n;if(k)startT(sh(p).slice(0,k),false)};
 if(ms.length)$('ms').onclick=function(){startT(sh(ms),true)};
 $('rs').onclick=function(e){if(e.target.dataset.sure){S.stars=[];S.best={};S.miss={};save();quiz()}else{e.target.dataset.sure=1;e.target.textContent='Нажми ещё раз, чтобы удалить всё'}};
}
function startT(items,mist){T={items:items,i:0,sc:0,bad:[],mist:mist};nextQ()}
function nextQ(){
 if(T.i>=T.items.length)return result();
 var it=T.items[T.i],len=T.items.length;
 var rev=isR(it.c)&&D.filter(function(x){return x.a==it.a}).length==1&&Math.random()<(cfg.rev?.4:.5);
 var nq=!rev&&isQ(it.c)&&Math.random()<.5;
 var Q=rev?it.a:(nq?hd(it):it.q),ans=(rev||nq)?it.q:it.a;
 function src(x){return (rev||nq)?x.q:x.a}
 var same=D.filter(function(x){return x.c==it.c&&src(x)!=ans}),other=D.filter(function(x){return x.c!=it.c&&src(x)!=ans});
 var seen={},opts=[ans];seen[ans]=1;
 sh(same).concat(sh(other)).forEach(function(x){if(opts.length<4&&!seen[src(x)]){seen[src(x)]=1;opts.push(src(x))}});
 var sm=cfg.sim?simOpts(it,rev):nq?(it.c=='h'?hyd(it):null):(cfg.gen&&cfg.revc&&cfg.revc.indexOf(it.c)>-1)?smart(it,rev):null;opts=sm||sh(opts);
 var lq=cfg.ql&&cfg.ql[it.c],lab=Array.isArray(lq)?lq[(rev||nq)?1:0]:(lq||cfg.qlab[rev?1:0]);
 $('app').innerHTML='<div class="stat"><span>Вопрос '+(T.i+1)+' из '+len+'</span><span>Верно: '+T.sc+'</span></div><div class="bar"><i style="width:'+T.i/len*100+'%"></i></div><div class="q" style="--c:'+col(it.c)+'"><small>'+lab+'</small><b>'+fm(Q)+'</b>'+(cfg.draw&&it.m?'<div class="mol">'+drawMol(it.m)+'</div>':'')+'</div><div id="os">'+opts.map(function(x,i){return '<button class="opt" data-i="'+i+'">'+fm(x)+'</button>'}).join('')+'</div><div class="fb" id="fb" aria-live="polite"></div><div class="btns" id="nx"></div>';
 $('os').onclick=function(e){
  var b=e.target.closest('.opt');if(!b||$('nx').innerHTML)return;
  var right=opts[b.dataset.i]==ans;
  if(right){T.sc++;delete S.miss[it.id]}else{T.bad.push(it);S.miss[it.id]=1}
  save();
  R.querySelectorAll('.opt').forEach(function(el,i){if(opts[i]==ans)el.classList.add('ok');else if(el==b)el.classList.add('bad')});
  $('fb').innerHTML=(right?'Верно! ':'Неверно. ')+fm(it.q)+': '+fm(it.a)+(it.x?'. '+fm(it.x):'');
  $('nx').innerHTML='<button class="go" id="nb">'+(T.i+1==len?'Показать результат':'Дальше')+'</button>';
  $('nb').onclick=function(){T.i++;nextQ()};$('nb').focus();
 };
}
function li(x){return '<div class="li" style="--c:'+col(x.c)+'"><b>'+fm(x.q)+'</b><span>'+fm(x.a)+'</span><small>'+fm(x.x)+'</small>'+(cfg.draw&&x.m?'<div class="mol" style="grid-column:1/-1">'+drawMol(x.m)+'</div>':'')+'</div>'}
function result(){
 var n=T.items.length,bad=T.bad.length,pct=Math.round(T.sc/n*100),old=S.best[cat],note='';
 if(!T.mist){if(!old||pct>old.pct){S.best[cat]={sc:T.sc,n:n,pct:pct};note=old?'Новый рекорд!':''}save()}
 var v=pct>=90?'Отлично!':pct>=70?'Хорошо, осталось подтянуть мелочи':pct>=50?'Неплохо, но стоит повторить':'Вернись к карточкам и попробуй ещё раз';
 $('app').innerHTML='<div class="res"><small>'+C[cat][0]+(T.mist?', работа над ошибками':'')+'</small><b>'+T.sc+' из '+n+'</b><div>'+pct+'%</div><p>'+v+' '+note+'</p><div class="score"><div class="s1"><b>'+T.sc+'</b>верно</div><div class="s2"><b>'+bad+'</b>неверно</div></div></div>'+(bad?'<p class="sub">Разбор ошибок</p>'+T.bad.map(li).join(''):'')+'<div class="btns" style="margin-top:16px">'+(bad?'<button id="rm">Повторить ошибки</button>':'')+'<button class="go" id="ra">Пройти заново</button></div><div class="tools"><button id="tc">К карточкам</button></div>';
 if(bad)$('rm').onclick=function(){startT(sh(T.bad),true)};
 $('ra').onclick=quiz;$('tc').onclick=function(){mode='cards';go()};
}
function list(){$('app').innerHTML=pool().map(li).join('')}
go();
}

 const tools=`<div class="tools"><button id="shf">Перемешать</button><button id="swp">${side=='n'?'Сначала название':'Сначала формула'}</button><button id="onl" aria-pressed="${onlyStar}">Только ★</button></div>`;
 if(!d.length){A.innerHTML=`<p class="sub" style="text-align:center;padding:40px 0">Нет карточек со звёздочкой. Отметь ★ на нужных карточках.</p>`+tools;bind();return}
 ix=(ix+d.length)%d.length;const it=d[ix],on=stars.has(it.n),st=`<button class="star" aria-label="Отметить звёздочкой">${on?'★':'☆'}</button>`;
 const A1=side=='n'?it.n:fm(it.f),B1=side=='n'?fm(it.f):it.n;
 A.innerHTML=`<div class="bar"><i style="width:${(ix+1)/d.length*100}%"></i></div>
 <div class="scene"><div class="card" id="cd" tabindex="0" role="button" aria-label="Перевернуть карточку" style="--c:${col(it.c)}">
 <div class="face front">${st}<small>${CATS[it.c][0]}</small><b>${A1}</b></div>
 <div class="face back">${st}<div class="fm" style="${side=='n'?'':'font-size:28px'}">${B1}</div><div class="sys">${side=='n'?fm(it.s):fm(it.f)+', '+fm(it.s)}</div></div></div></div>
 <div class="nav"><button id="pv" aria-label="Назад">←</button><span>${ix+1} / ${d.length}</span><button id="nt" aria-label="Вперёд">→</button></div>`+tools;
 const cd=$('cd');cd.onclick=e=>{if(e.target.closest('.star'))return;cd.classList.toggle('flip')};
 cd.onkeydown=e=>{if(e.key==' '||e.key=='Enter'){e.preventDefault();cd.classList.toggle('flip')}};
 cd.querySelectorAll('.star').forEach(b=>b.onclick=()=>{on?stars.delete(it.n):stars.add(it.n);S.stars=[...stars];save();drawC()});
 $('pv').onclick=()=>{ix--;drawC()};$('nt').onclick=()=>{ix++;drawC()};bind();
}
function bind(){
 $('shf').onclick=()=>{dk=sh(dk);ix=0;drawC()};
 $('swp').onclick=()=>{side=side=='n'?'f':'n';S.side=side;save();drawC()};
 $('onl').onclick=()=>{onlyStar=!onlyStar;ix=0;drawC()};
}
document.addEventListener('keydown',e=>{if(TOK!==tok||mode!='cards'||!$('pv'))return;if(e.key=='ArrowRight')$('nt').click();if(e.key=='ArrowLeft')$('pv').click()});
let T=null;
function quiz(){
 const p=pool(),n=p.length,b=S.best[cat],ms=p.filter(x=>S.miss[x.n]);
 const lens=[10,20].filter(x=>x<n).concat([n]);
 $('app').innerHTML=`<div class="q" style="--c:${col(cat)}"><small>Тест по группе</small><b>${CATS[cat][0]}</b></div>
 ${b?`<p class="sub" style="text-align:center">Лучший результат: ${b.sc} из ${b.n} (${b.pct}%)</p>`:''}
 <p class="sub" style="text-align:center">Сколько вопросов?</p>
 <div class="btns" id="ln">${lens.map(x=>`<button class="go" data-n="${x}">${x==n?'Все '+n:x}</button>`).join('')}</div>
 ${ms.length?`<div class="btns" style="margin-top:10px"><button id="ms">Работа над ошибками (${ms.length})</button></div>`:''}
 <div class="tools"><button id="rs">Сбросить прогресс</button></div>`;
 $('ln').onclick=e=>{const k=+e.target.dataset.n;if(k)startT(sh(p).slice(0,k),false)};
 if(ms.length)$('ms').onclick=()=>startT(sh(ms),true);
 $('rs').onclick=e=>{if(e.target.dataset.sure){S.stars=[];S.best={};S.miss={};save();stars=new Set();onlyStar=false;quiz()}else{e.target.dataset.sure=1;e.target.textContent='Нажми ещё раз, чтобы удалить всё'}};
}
function startT(items,mist){T={items,i:0,sc:0,bad:[],mist};nextQ()}
function nextQ(){
 if(T.i>=T.items.length)return result();
 const it=T.items[T.i],len=T.items.length;
 const dup=D.filter(x=>x.f==it.f).length>1;
 const rev=!dup&&Math.random()<.4;
 const key=rev?'n':'f';
 let alt=D.filter(x=>x.c==it.c&&x.f!=it.f);
 if(alt.length<3)alt=alt.concat(D.filter(x=>x.c!=it.c&&x.f!=it.f));
 const seen=new Set([it[key]]),opts=[it];
 for(const x of sh(alt)){if(opts.length==4)break;if(!seen.has(x[key])){seen.add(x[key]);opts.push(x)}}
 const o=sh(opts);
 $('app').innerHTML=`<div class="stat"><span>Вопрос ${T.i+1} из ${len}</span><span>Верно: ${T.sc}</span></div>
 <div class="bar"><i style="width:${T.i/len*100}%"></i></div>
 <div class="q" style="--c:${col(it.c)}"><small>${rev?'Как называется вещество?':'Формула вещества'}</small><b>${rev?fm(it.f):it.n}</b></div>
 <div id="os">${o.map((x,i)=>`<button class="opt" data-i="${i}">${rev?x.n:fm(x.f)}</button>`).join('')}</div>
 <div class="fb" id="fb" aria-live="polite"></div><div class="btns" id="nx"></div>`;
 $('os').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||$('nx').innerHTML)return;
  const x=o[b.dataset.i],right=x==it;
  if(right){T.sc++;delete S.miss[it.n]}else{T.bad.push(it);S.miss[it.n]=1}
  save();
  [...document.querySelectorAll('.opt')].forEach((el,i)=>{if(o[i]==it)el.classList.add('ok');else if(el==b)el.classList.add('bad')});
  $('fb').innerHTML=(right?'Верно! ':'Неверно. ')+`${it.n}: ${fm(it.f)}, ${fm(it.s)}`;
  $('nx').innerHTML=`<button class="go" id="nb">${T.i+1==len?'Показать результат':'Дальше'}</button>`;
  $('nb').onclick=()=>{T.i++;nextQ()};$('nb').focus();
 };
}
function result(){
 const n=T.items.length,bad=T.bad.length,pct=Math.round(T.sc/n*100);
 const old=S.best[cat];let note='';
 if(!T.mist){if(!old||pct>old.pct){S.best[cat]={sc:T.sc,n,pct};note=old?'Новый рекорд!':''}save()}
 const v=pct>=90?'Отлично!':pct>=70?'Хорошо, осталось подтянуть мелочи':pct>=50?'Неплохо, но стоит повторить':'Вернись к карточкам и попробуй ещё раз';
 $('app').innerHTML=`<div class="res"><small>${CATS[cat][0]}${T.mist?', работа над ошибками':''}</small><b>${T.sc} из ${n}</b><div>${pct}%</div><p>${v} ${note}</p>
 <div class="score"><div class="s1"><b>${T.sc}</b>верно</div><div class="s2"><b>${bad}</b>неверно</div></div></div>
 ${bad?`<p class="sub">Разбор ошибок</p>`+T.bad.map(x=>`<div class="li" style="--c:${col(x.c)}"><b>${x.n}</b><span>${fm(x.f)}</span><small>${fm(x.s)}</small></div>`).join(''):''}
 <div class="btns" style="margin-top:16px">${bad?'<button id="rm">Повторить ошибки</button>':''}<button class="go" id="ra">Пройти заново</button></div>
 <div class="tools"><button id="tc">К карточкам</button></div>`;
 if(bad)$('rm').onclick=()=>startT(sh(T.bad),true);
 $('ra').onclick=quiz;$('tc').onclick=()=>{mode='cards';go()};
}
function list(){
 $('app').innerHTML=pool().map(x=>`<div class="li" style="--c:${col(x.c)}"><b>${x.n}</b><span>${fm(x.f)}</span><small>${fm(x.s)}</small></div>`).join('');
}
go();
}

/* ===== Навигация ===== */
function B(h,n,d,c){return '<a class="btn" style="--c:'+c+'" href="#'+h+'" data-go="'+h+'"><b>'+n+'</b><span>'+d+'</span></a>'}
function K(h,l){return '<a class="nb" href="#'+h+'" data-go="'+h+'">← '+l+'</a>'}
var PAGES=['home','neorganika','organika','neorg-trivial'];
function show(h){
 if(PAGES.indexOf(h)<0&&!CFG[h])h='home';
 if(h===CUR)return;CUR=h;
 var tok=++TOK,m=document.getElementById('m'),t;window.scrollTo(0,0);
 if(h=='neorg-trivial'){document.title='Химия с Хафизовым. Тривиальные названия неорганических веществ';neorgTrivial(m,tok);return}
 if(CFG[h]){var p=h.indexOf('neorg')==0?['neorganika','Неорганика']:['organika','Органика'];t=TT[h]||['Кислотные остатки','Кислотные остатки для ЕГЭ'];document.title='Химия с Хафизовым. '+t[0];m.innerHTML=K(p[0],p[1])+'<h1>'+t[0]+'</h1><p class="sub">'+t[1]+'</p><div id="deck"></div>';mountDeck(document.getElementById('deck'),CFG[h],tok);return}
 if(h=='neorganika'){document.title='Химия с Хафизовым. Неорганика';m.innerHTML=K('home','Главная')+'<h1>Неорганика</h1><p class="sub">Выбери тему:</p>'+B('neorg-trivial','Тривиальные названия неорганических веществ','Карточки, тест, кислоты и соли','#3E6FB0')+B('neorg-class','Классификация неорганических веществ','Оксиды, гидроксиды, кислоты, соли','#A8650A')}
 else if(h=='organika'){document.title='Химия с Хафизовым. Органика';m.innerHTML=K('home','Главная')+'<h1>Органика</h1><p class="sub">Выбери тему:</p>'+B('org-trivial','Тривиальные названия органических веществ','Карточки и тест','#2E8B6A')+B('org-class','Классификация органических веществ','Классы и общие формулы','#8A5AA8')}
 else{document.title='Химия с Хафизовым';m.innerHTML='<h1>Химия с Хафизовым</h1><p class="sub">Подготовка к ЕГЭ по химии. Выбери раздел:</p>'+B('neorganika','Неорганика','Неорганическая химия','#3E6FB0')+B('organika','Органика','Органическая химия','#2E8B6A')}
}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-go]');if(a){e.preventDefault();var h=a.getAttribute('data-go');try{location.hash=h}catch(x){}show(h)}});
window.addEventListener('hashchange',function(){show(location.hash.slice(1)||'home')});
show(location.hash.slice(1)||'home');
</script></body></html>
